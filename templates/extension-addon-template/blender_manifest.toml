schema_version = "1.0.0"

id = "example_addon"
version = "0.1.0"
name = "Example Addon"
tagline = "Minimal Extensions Platform starting point"
# Replace the maintainer line with your own name and a real contact address.
maintainer = "Your Name <you@your-domain.example>"
type = "add-on"

blender_version_min = "4.5.0"

# extensions.blender.org requires GPL-3.0-or-later for add-ons that ship code.
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 TMHSDigital"]

website = "https://github.com/TMHSDigital/Blender-Developer-Tools"

tags = ["Object"]

# Keep CI-only files out of the package `blender --command extension build`
# writes: the GitHub workflow, the register test and earlier build output.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/tests/",
  "/dist/",
  "/*.zip",
]
