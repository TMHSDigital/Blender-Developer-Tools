name: Ecosystem drift check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  drift-check:
    name: Ecosystem drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: TMHSDigital/Developer-Tools-Directory/.github/actions/drift-check@7886cbe6ef93d57cc73c020b98268fa0dc0bdc98 # v1.19.2
        with:
          mode: self
          format: gh-summary
          # The action checks out and runs the meta-repo's Python at this ref.
          # Its default is the floating `v1` tag, so pin the same commit as the
          # action itself (v1 and v1.19.2 both resolve to it).
          meta-repo-ref: 7886cbe6ef93d57cc73c020b98268fa0dc0bdc98
