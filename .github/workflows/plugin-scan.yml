name: HOL plugin scan

# Runs HOL's AI plugin scanner (hashgraph-online/ai-plugin-scanner-action) over
# the repo: manifests, skills, the opt-in MCP server, workflow permissions and
# dependency pinning. The HOL registry lists this pack and takes 10% off its
# Trust Score while no security scan runs in the source repo's CI (#510).
#
# Static and offline: `online` stays false, so the scanner reads the checkout
# and nothing else, and submission automation stays off. The run fails only
# on a high or critical finding; lower findings show in the job summary and,
# on main, in the Security tab via SARIF.
#
# The `cisco` dispatch input also installs and runs the Cisco skill scanner,
# the one HOL times out on for every skill (#513).

on:
  workflow_dispatch:
    inputs:
      cisco:
        description: "Also run the Cisco skill scanner (slower; #513)"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 3"   # weekly, Wednesday 09:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plugin-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan the plugin with the HOL AI plugin scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # SARIF upload; used on main only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan
        id: scan
        uses: hashgraph-online/ai-plugin-scanner-action@5065ff849b5255dc24a8092c084a1c5060d8633e # v1.2.807
        with:
          plugin_dir: "."
          mode: scan
          format: sarif
          output: plugin-scan.sarif
          fail_on_severity: high
          upload_sarif: ${{ github.event_name != 'pull_request' }}
          publish_hint: false
          cisco_skill_scan: ${{ inputs.cisco && 'on' || 'auto' }}
          install_cisco: ${{ inputs.cisco || false }}

      # The action publishes its summary and SARIF only when the scan passes,
      # so list the findings from the report here, pass or fail.
      - name: List the findings
        if: always() && hashFiles('plugin-scan.sarif') != ''
        env:
          SCORE: ${{ steps.scan.outputs.score }}
          GRADE: ${{ steps.scan.outputs.grade }}
        run: |
          python3 - << 'PYEOF'
          import json, os
          sarif = json.load(open("plugin-scan.sarif", encoding="utf-8"))
          rules = {r["id"]: r for run in sarif.get("runs", [])
                   for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
          lines = [f"### HOL plugin scan: score {os.environ['SCORE']} ({os.environ['GRADE']})", "",
                   "| Level | Rule | Where | Finding |", "| --- | --- | --- | --- |"]
          for run in sarif.get("runs", []):
              for res in run.get("results", []):
                  loc = res.get("locations") or [{}]
                  phys = loc[0].get("physicalLocation", {})
                  where = phys.get("artifactLocation", {}).get("uri", "")
                  line = phys.get("region", {}).get("startLine")
                  where += f":{line}" if line else ""
                  rule = res.get("ruleId", "")
                  sev = (res.get("properties") or {}).get("severity") or res.get("level", "")
                  msg = res.get("message", {}).get("text", "").replace("|", "/").replace("\n", " ")
                  lines.append(f"| {sev} | `{rule}` | `{where}` | {msg} |")
          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          PYEOF
