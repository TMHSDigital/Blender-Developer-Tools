name: Ecosystem drift check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  drift-check:
    name: Ecosystem drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: TMHSDigital/Developer-Tools-Directory/.github/actions/drift-check@f10dd5e060ffcd30e44b950c09af970f96579ff8 # v1.20.0
        with:
          mode: self
          format: gh-summary
          # The action checks out and runs the meta-repo's Python at this ref.
          # Its default is the floating `v1` tag, so pin the same commit as the
          # action itself (v1, v1.20 and v1.20.0 all resolve to it today).
          meta-repo-ref: f10dd5e060ffcd30e44b950c09af970f96579ff8
