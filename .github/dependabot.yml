version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/scripts/site"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-build:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    # requirements-dev.txt pulls in scripts/site/requirements.txt with -r, so
    # without this the site pins get two identical PRs (site-build and
    # dev-tools) on every bump. The /scripts/site entry owns them.
    ignore:
      - dependency-name: "jinja2"
      - dependency-name: "markupsafe"
    groups:
      dev-tools:
        patterns:
          - "*"
